<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hugo Picot — AI systems, data products and product engineering</title>
  <desc id="desc">Animated dark banner with a network of autonomous agents and a terminal-style introduction.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A12"/>
      <stop offset="0.52" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#070A12"/>
    </linearGradient>
    <linearGradient id="accent" x1="82" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11D9C5">
        <animate attributeName="stop-color" values="#11D9C5;#38BDF8;#11D9C5" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.52" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#8B5CF6;#38BDF8" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#11D9C5;#8B5CF6" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowCyan">
      <stop stop-color="#11D9C5" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#11D9C5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet">
      <stop stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#8DA2C9" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="418" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" rx="30" fill="url(#background)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>

    <circle cx="215" cy="-10" r="280" fill="url(#glowCyan)" opacity="0.55">
      <animate attributeName="cx" values="215;300;215" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="410" r="310" fill="url(#glowViolet)" opacity="0.62">
      <animate attributeName="cy" values="410;330;410" dur="13s" repeatCount="indefinite"/>
    </circle>

    <g opacity="0.92">
      <rect x="70" y="62" width="98" height="30" rx="15" fill="#101728" stroke="#25324D"/>
      <circle cx="91" cy="77" r="5" fill="#11D9C5">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="107" y="82" fill="#B6C4E0" font-size="12" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1.6">ONLINE</text>
    </g>

    <text x="70" y="154" fill="#F5F8FF" font-size="56" font-weight="800" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1">HUGO PICOT</text>
    <rect x="70" y="172" width="625" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="width" values="160;625;625" keyTimes="0;0.55;1" dur="2.5s" fill="freeze"/>
    </rect>

    <text x="70" y="220" fill="#AAB8D3" font-size="19" font-family="Segoe UI, Arial, sans-serif" letter-spacing="3">AI SYSTEMS  ·  DATA PRODUCTS  ·  ENGINEERING</text>

    <g transform="translate(70 266)">
      <rect width="570" height="86" rx="13" fill="#080D18" fill-opacity="0.82" stroke="#25324D"/>
      <circle cx="24" cy="21" r="4" fill="#FF6B6B"/>
      <circle cx="39" cy="21" r="4" fill="#F4B942"/>
      <circle cx="54" cy="21" r="4" fill="#11D9C5"/>
      <text x="24" y="57" fill="#11D9C5" font-size="16" font-family="Consolas, Menlo, monospace">&gt;</text>
      <text x="46" y="57" fill="#D9E3F6" font-size="16" font-family="Consolas, Menlo, monospace">building ambitious systems</text>
      <rect x="308" y="43" width="9" height="19" rx="1" fill="#8B5CF6">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="1.05s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(760 66)">
      <rect width="368" height="288" rx="24" fill="#090F1C" fill-opacity="0.75" stroke="#24304A"/>
      <text x="26" y="38" fill="#7082A5" font-size="12" font-family="Consolas, Menlo, monospace" letter-spacing="1.5">SYSTEM / ACTIVE</text>

      <g stroke="#405174" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.8">
        <path d="M84 105 L180 75 L284 114 L244 214 L128 225 Z">
          <animate attributeName="stroke-dashoffset" values="0;-24" dur="2.8s" repeatCount="indefinite"/>
        </path>
        <path d="M84 105 L244 214 M180 75 L128 225 M284 114 L128 225">
          <animate attributeName="stroke-dashoffset" values="0;-24" dur="3.4s" repeatCount="indefinite"/>
        </path>
      </g>

      <g filter="url(#softGlow)">
        <circle cx="84" cy="105" r="9" fill="#11D9C5">
          <animate attributeName="r" values="8;12;8" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="180" cy="75" r="8" fill="#38BDF8">
          <animate attributeName="r" values="8;11;8" dur="3.1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="284" cy="114" r="9" fill="#8B5CF6">
          <animate attributeName="r" values="9;13;9" dur="2.9s" repeatCount="indefinite"/>
        </circle>
        <circle cx="244" cy="214" r="8" fill="#F4B942">
          <animate attributeName="r" values="8;11;8" dur="3.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="128" cy="225" r="10" fill="#11D9C5">
          <animate attributeName="r" values="10;14;10" dur="3.7s" repeatCount="indefinite"/>
        </circle>
      </g>

      <g fill="#93A5C6" font-size="10" font-family="Consolas, Menlo, monospace" letter-spacing="1">
        <text x="62" y="132">AGENT_01</text>
        <text x="158" y="54">ROUTER</text>
        <text x="264" y="142">TOOLS</text>
        <text x="222" y="243">EVALS</text>
        <text x="103" y="255">LOCAL</text>
      </g>

      <circle cx="84" cy="105" r="3" fill="#FFFFFF">
        <animateMotion dur="4.5s" repeatCount="indefinite" path="M0 0 L96 -30 L200 9 L160 109 L44 120 Z"/>
      </circle>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="29" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="2"/>
</svg>
